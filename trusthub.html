<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustHub — Verified Local Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12213B;
    --ink-soft:#28395c;
    --parchment:#F7F3EA;
    --parchment-deep:#EFE8D8;
    --brass:#B8863B;
    --brass-light:#e7cd9c;
    --green:#2F6E4E;
    --green-bg:#e7f0e9;
    --clay:#B4482F;
    --clay-bg:#f6e6e1;
    --charcoal:#1E1B16;
    --slate:#665f52;
    --line:#ddd3bd;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--charcoal);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Fraunces',serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--brass); outline-offset:2px;
  }
  ::selection{background:var(--brass-light);}

  #app{max-width:1180px;margin:0 auto;min-height:100vh;position:relative;}

  /* ---------- NAV ---------- */
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;border-bottom:1px solid var(--line);
    background:var(--parchment);position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:2px;
    background:var(--ink);color:var(--brass-light);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:18px;
  }
  .brand .word{font-family:'Fraunces',serif;font-weight:600;font-size:21px;color:var(--ink);}
  .brand .word span{color:var(--brass);}
  .nav-links{display:flex;gap:28px;align-items:center;}
  .nav-links a{font-size:14.5px;color:var(--slate);border-bottom:2px solid transparent;padding-bottom:4px;}
  .nav-links a.active,.nav-links a:hover{color:var(--ink);border-color:var(--brass);}
  .nav-right{display:flex;gap:12px;align-items:center;}
  .navbtn{padding:9px 18px;font-size:14px;border-radius:2px;font-weight:600;}
  .navbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .navbtn.solid{background:var(--ink);color:var(--white);}
  .navbtn.ghost:hover{background:var(--ink);color:var(--white);}
  .navbtn.solid:hover{background:var(--ink-soft);}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--brass-light);
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;border:1px solid var(--brass);
  }
  .mobile-menu-btn{display:none;background:none;font-size:22px;color:var(--ink);}

  main{padding:0 24px 80px;}

  /* ---------- HOME ---------- */
  .hero{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:48px;
    padding:64px 0 40px;align-items:center;border-bottom:1px solid var(--line);
  }
  .eyebrow-seal{
    display:inline-flex;align-items:center;gap:8px;
    border:1px solid var(--brass);color:var(--brass);
    padding:5px 12px;border-radius:2px;font-size:12.5px;font-weight:600;margin-bottom:22px;
    letter-spacing:.02em;
  }
  .hero h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:52px;line-height:1.06;
    color:var(--ink);margin:0 0 20px;letter-spacing:-0.01em;
  }
  .hero p.lead{font-size:17px;color:var(--slate);line-height:1.6;max-width:46ch;margin-bottom:32px;}
  .search-bar{
    display:flex;background:var(--white);border:1.5px solid var(--ink);
    border-radius:2px;overflow:hidden;max-width:520px;
  }
  .search-bar input{
    flex:1;border:none;padding:15px 16px;font-size:15px;background:transparent;
  }
  .search-bar input:focus{outline:none;}
  .search-bar button{
    background:var(--ink);color:var(--white);padding:0 24px;font-weight:600;font-size:14.5px;
  }
  .search-bar button:hover{background:var(--ink-soft);}
  .chip-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
  .chip{
    border:1px solid var(--line);background:var(--white);padding:8px 14px;
    border-radius:20px;font-size:13.5px;color:var(--ink);
  }
  .chip:hover{border-color:var(--brass);}
  .stat-row{display:flex;gap:36px;margin-top:34px;flex-wrap:wrap;}
  .stat b{font-family:'Fraunces',serif;font-size:26px;color:var(--ink);display:block;}
  .stat span{font-size:12.5px;color:var(--slate);}

  .hero-card{
    background:var(--ink);border-radius:3px;padding:30px;color:var(--white);position:relative;
    background-image: radial-gradient(circle at 85% 15%, rgba(184,134,59,0.18), transparent 55%);
  }
  .seal-big{
    width:96px;height:96px;border-radius:50%;border:3px solid var(--brass);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:0 auto 18px;background:rgba(184,134,59,0.08);
  }
  .seal-big b{font-family:'Fraunces',serif;font-size:30px;color:var(--brass-light);line-height:1;}
  .seal-big span{font-size:10px;color:var(--brass-light);letter-spacing:.05em;}
  .hero-card h3{font-family:'Fraunces',serif;font-weight:500;font-size:19px;text-align:center;margin:0 0 6px;}
  .hero-card p{font-size:13.5px;color:#c9d0e0;text-align:center;margin:0 0 20px;line-height:1.5;}
  .factor-list{display:flex;flex-direction:column;gap:10px;}
  .factor{display:flex;justify-content:space-between;align-items:center;font-size:13px;border-top:1px solid rgba(255,255,255,0.12);padding-top:10px;}
  .factor .fname{color:#dfe3ee;}
  .factor .fval{font-family:'Fraunces',serif;color:var(--brass-light);font-weight:600;}

  .cat-section{padding:44px 0;border-bottom:1px solid var(--line);}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px;}
  .section-head h2{font-family:'Fraunces',serif;font-size:26px;color:var(--ink);margin:0;font-weight:600;}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .cat-card{
    border:1px solid var(--line);background:var(--white);padding:22px 18px;border-radius:2px;
    display:flex;flex-direction:column;gap:10px;
  }
  .cat-card:hover{border-color:var(--brass);}
  .cat-card .ic{font-size:24px;}
  .cat-card .name{font-weight:600;font-size:15px;color:var(--ink);}
  .cat-card .count{font-size:12.5px;color:var(--slate);}

  .how-section{padding:44px 0;}
  .how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .how-step{border-left:2px solid var(--brass);padding-left:18px;}
  .how-step .num{font-family:'Fraunces',serif;color:var(--brass);font-size:14px;font-weight:600;}
  .how-step h4{font-family:'Fraunces',serif;font-size:18px;margin:6px 0 8px;color:var(--ink);}
  .how-step p{font-size:14px;color:var(--slate);line-height:1.55;margin:0;}

  /* ---------- SEARCH ---------- */
  .search-top{padding:32px 0 20px;border-bottom:1px solid var(--line);}
  .search-top h2{font-family:'Fraunces',serif;font-size:26px;margin:0 0 4px;color:var(--ink);}
  .search-top .meta{font-size:13.5px;color:var(--slate);}
  .search-layout{display:grid;grid-template-columns:250px 1fr;gap:32px;padding-top:28px;}
  .filter-box{border:1px solid var(--line);background:var(--white);border-radius:2px;padding:20px;height:fit-content;}
  .filter-box h4{font-family:'Fraunces',serif;font-size:15px;margin:0 0 12px;color:var(--ink);}
  .filter-group{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .filter-group:last-child{border-bottom:none;}
  .filter-opt{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--charcoal);margin-bottom:9px;cursor:pointer;}
  .filter-opt input{accent-color:var(--brass);}
  .results-col{display:flex;flex-direction:column;gap:14px;}
  .sort-row{display:flex;justify-content:flex-end;margin-bottom:4px;}
  .sort-row select{border:1px solid var(--line);padding:8px 10px;border-radius:2px;font-size:13.5px;background:var(--white);}

  .provider-card{
    border:1px solid var(--line);background:var(--white);border-radius:2px;
    display:grid;grid-template-columns:140px 1fr auto;gap:20px;padding:18px;align-items:center;
  }
  .provider-card:hover{border-color:var(--brass);}
  .p-thumb{
    width:140px;height:100px;border-radius:2px;background:linear-gradient(135deg,var(--ink),var(--ink-soft));
    display:flex;align-items:center;justify-content:center;color:var(--brass-light);
    font-family:'Fraunces',serif;font-size:26px;font-weight:600;
  }
  .p-body h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 4px;color:var(--ink);}
  .p-body .p-meta{font-size:13px;color:var(--slate);margin-bottom:8px;}
  .p-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .p-tag{font-size:11.5px;border:1px solid var(--line);padding:3px 8px;border-radius:12px;color:var(--slate);}
  .p-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .trust-pill{
    display:flex;align-items:center;gap:6px;border:1px solid var(--brass);color:var(--brass);
    padding:4px 10px;border-radius:2px;font-size:12.5px;font-weight:700;
  }
  .verified-pill{display:flex;align-items:center;gap:5px;color:var(--green);font-size:12.5px;font-weight:600;}
  .price-tag{font-size:12.5px;color:var(--slate);}
  .price-tag b{color:var(--ink);font-size:15px;}
  .btn-primary{background:var(--ink);color:var(--white);padding:9px 18px;border-radius:2px;font-size:13.5px;font-weight:600;}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-outline{background:transparent;border:1px solid var(--ink);color:var(--ink);padding:9px 18px;border-radius:2px;font-size:13.5px;font-weight:600;}
  .btn-outline:hover{background:var(--ink);color:var(--white);}

  /* ---------- PROVIDER PROFILE ---------- */
  .profile-hero{display:grid;grid-template-columns:1fr 320px;gap:32px;padding:36px 0;border-bottom:1px solid var(--line);}
  .profile-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px;}
  .profile-mark{
    width:74px;height:74px;border-radius:2px;background:linear-gradient(135deg,var(--ink),var(--ink-soft));
    display:flex;align-items:center;justify-content:center;color:var(--brass-light);
    font-family:'Fraunces',serif;font-size:30px;flex-shrink:0;
  }
  .profile-head h1{font-family:'Fraunces',serif;font-size:30px;margin:0 0 4px;color:var(--ink);}
  .profile-head .sub{font-size:14px;color:var(--slate);}
  .tab-row{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:20px 0 20px;}
  .tab{padding-bottom:12px;font-size:14.5px;color:var(--slate);border-bottom:2px solid transparent;font-weight:500;}
  .tab.active{color:var(--ink);border-color:var(--brass);font-weight:600;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  .info-box{border:1px solid var(--line);background:var(--white);padding:16px;border-radius:2px;}
  .info-box .k{font-size:11.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .info-box .v{font-family:'Fraunces',serif;font-size:20px;color:var(--ink);}

  .trust-card{border:1px solid var(--brass);background:var(--white);border-radius:2px;padding:24px;height:fit-content;}
  .trust-card .seal-big{margin-bottom:14px;}
  .trust-breakdown{display:flex;flex-direction:column;gap:11px;margin:18px 0;}
  .tb-row{font-size:13px;}
  .tb-row .tb-top{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--charcoal);}
  .tb-bar{height:5px;background:var(--parchment-deep);border-radius:3px;overflow:hidden;}
  .tb-fill{height:100%;background:var(--brass);}
  .review-item{border-bottom:1px solid var(--line);padding:16px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-item .r-top{display:flex;justify-content:space-between;font-size:13.5px;color:var(--slate);margin-bottom:6px;}
  .review-item .r-name{font-weight:600;color:var(--ink);}
  .review-item p{margin:0;font-size:14px;line-height:1.55;color:var(--charcoal);}
  .stars{color:var(--brass);font-size:13px;}

  /* ---------- BOOKING ---------- */
  .booking-wrap{padding:36px 0;}
  .step-track{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:40px;}
  .step-dot{
    width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);color:var(--slate);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--white);
  }
  .step-dot.active{border-color:var(--ink);background:var(--ink);color:var(--white);}
  .step-dot.done{border-color:var(--green);background:var(--green);color:var(--white);}
  .step-line{width:60px;height:1.5px;background:var(--line);}
  .step-line.done{background:var(--green);}
  .step-label{font-size:11px;color:var(--slate);text-align:center;margin-top:6px;width:80px;}
  .booking-grid{display:grid;grid-template-columns:1fr 320px;gap:32px;}
  .form-card{border:1px solid var(--line);background:var(--white);padding:26px;border-radius:2px;}
  .form-card h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 20px;color:var(--ink);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;color:var(--slate);margin-bottom:6px;font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%;border:1px solid var(--line);padding:11px 13px;border-radius:2px;font-size:14.5px;
    font-family:'Inter',sans-serif;background:var(--parchment);
  }
  .field textarea{min-height:80px;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass);}
  .summary-card{border:1px solid var(--line);background:var(--white);padding:22px;border-radius:2px;height:fit-content;}
  .summary-card h4{font-family:'Fraunces',serif;font-size:16px;margin:0 0 16px;color:var(--ink);}
  .summary-row{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line);}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--slate);}
  .summary-row .v{color:var(--ink);font-weight:600;}
  .btn-block{width:100%;padding:13px;margin-top:16px;border-radius:2px;font-weight:700;font-size:14.5px;}
  .done-box{text-align:center;padding:60px 0;}
  .done-box .ok-mark{
    width:80px;height:80px;border-radius:50%;background:var(--green-bg);color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 22px;border:2px solid var(--green);
  }
  .done-box h2{font-family:'Fraunces',serif;color:var(--ink);font-size:26px;margin:0 0 8px;}
  .done-box p{color:var(--slate);font-size:14.5px;margin-bottom:26px;}

  /* ---------- AUTH ---------- */
  .auth-wrap{display:flex;justify-content:center;padding:60px 0;}
  .auth-card{width:400px;border:1px solid var(--line);background:var(--white);padding:34px;border-radius:2px;}
  .auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .auth-tab{flex:1;text-align:center;padding-bottom:12px;font-size:14.5px;color:var(--slate);border-bottom:2px solid transparent;font-weight:600;}
  .auth-tab.active{color:var(--ink);border-color:var(--brass);}
  .auth-card h2{font-family:'Fraunces',serif;font-size:24px;margin:0 0 4px;color:var(--ink);}
  .auth-card .sub{font-size:13.5px;color:var(--slate);margin-bottom:22px;}
  .role-pick{display:flex;gap:10px;margin-bottom:18px;}
  .role-opt{flex:1;text-align:center;border:1px solid var(--line);padding:10px;border-radius:2px;font-size:13px;font-weight:600;color:var(--slate);}
  .role-opt.active{border-color:var(--ink);background:var(--ink);color:var(--white);}
  .msg-err{background:var(--clay-bg);color:var(--clay);font-size:13px;padding:10px 12px;border-radius:2px;margin-bottom:14px;}
  .msg-ok{background:var(--green-bg);color:var(--green);font-size:13px;padding:10px 12px;border-radius:2px;margin-bottom:14px;}

  /* ---------- DASHBOARDS ---------- */
  .dash-layout{display:grid;grid-template-columns:220px 1fr;gap:32px;padding-top:28px;}
  .side-nav{display:flex;flex-direction:column;gap:2px;}
  .side-nav a{padding:10px 14px;font-size:14px;color:var(--slate);border-radius:2px;border-left:2px solid transparent;}
  .side-nav a.active{color:var(--ink);font-weight:600;border-left-color:var(--brass);background:var(--white);}
  .side-nav a:hover{background:var(--white);}
  .dash-head{margin-bottom:22px;}
  .dash-head h2{font-family:'Fraunces',serif;font-size:26px;margin:0 0 4px;color:var(--ink);}
  .dash-head .sub{font-size:13.5px;color:var(--slate);}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .kpi-card{border:1px solid var(--line);background:var(--white);padding:18px;border-radius:2px;}
  .kpi-card .kv{font-family:'Fraunces',serif;font-size:26px;color:var(--ink);}
  .kpi-card .kl{font-size:12px;color:var(--slate);margin-top:4px;}
  .panel{border:1px solid var(--line);background:var(--white);border-radius:2px;padding:22px;margin-bottom:20px;}
  .panel h3{font-family:'Fraunces',serif;font-size:17px;margin:0 0 16px;color:var(--ink);}
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .lr-main b{display:block;font-size:14.5px;color:var(--ink);}
  .list-row .lr-main span{font-size:12.5px;color:var(--slate);}
  .status-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:12px;}
  .status-pending{background:var(--clay-bg);color:var(--clay);}
  .status-progress{background:#fff4dd;color:#93630b;}
  .status-completed{background:var(--green-bg);color:var(--green);}
  .status-accepted{background:#e5edf7;color:#2a5c9a;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--slate);font-size:14px;}
  .flag-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}
  .flag-row:last-child{border-bottom:none;}
  .flag-sev{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;}
  .sev-high{background:var(--clay-bg);color:var(--clay);}
  .sev-med{background:#fff4dd;color:#93630b;}

  .footer{border-top:1px solid var(--line);padding:32px 24px;margin-top:40px;}
  .footer-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--slate);}

  .small-link{font-size:13.5px;color:var(--brass);font-weight:600;}
  .back-link{font-size:13.5px;color:var(--slate);margin-bottom:16px;display:inline-block;}
  .back-link:hover{color:var(--ink);}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr;}
    .cat-grid{grid-template-columns:repeat(2,1fr);}
    .how-grid{grid-template-columns:1fr;}
    .search-layout{grid-template-columns:1fr;}
    .provider-card{grid-template-columns:1fr;}
    .p-thumb{width:100%;height:80px;}
    .p-side{align-items:flex-start;}
    .profile-hero{grid-template-columns:1fr;}
    .booking-grid{grid-template-columns:1fr;}
    .dash-layout{grid-template-columns:1fr;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .nav-links{display:none;}
    .hero h1{font-size:36px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   TRUSTHUB — client-side prototype
   Persistence via window.storage (personal, per-user scope)
   ============================================================ */

/* ---------- Mock catalog data ---------- */
const CATEGORIES = [
  {id:'tech', name:'Tech & Repair', icon:'⌬', count:412},
  {id:'home', name:'Home Services', icon:'⌂', count:588},
  {id:'learn', name:'Tutoring', icon:'✎', count:201},
  {id:'vehicle', name:'Vehicle Care', icon:'⚙', count:167},

/* ---------- Trust score engine (the platform's core differentiator) ----------
   Weighted composite of four transparent signals, plus a rule-based
   penalty when review activity looks manipulated (burst + duplicate text).
   This mirrors the synopsis's "transparent trust-score mechanism". */
function reviewAnomalyPenalty(reviews){
  const recent = reviews.filter(r=>r.days<=3);
  if(recent.length<4) return {penalty:0, flagged:false};
  const texts = recent.map(r=>r.text.toLowerCase().replace(/[^a-z ]/g,'').split(' ').sort().join(' '));
  const uniqueShapes = new Set(texts.map(t=>t.slice(0,25)));
  const sameStar = recent.every(r=>r.stars===recent[0].stars);
  if(uniqueShapes.size <= Math.ceil(recent.length/2) && sameStar){
    return {penalty:28, flagged:true, count:recent.length};
  }
  return {penalty:0, flagged:false};
}
function completionRate(p){ return p.jobsAccepted ? p.jobsCompleted/p.jobsAccepted : 0; }
function avgStars(p){ return p.reviews.reduce((s,r)=>s+r.stars,0)/p.reviews.length; }
function computeTrust(p){
  const idScore = (p.identityVerified?20:0) + (p.contactVerified?10:0); // 30 max
  const compScore = Math.round(completionRate(p)*30); // 30 max
  const starScore = Math.round((avgStars(p)/5)*25); // 25 max
  const tenureScore = Math.min(15, p.yearsActive*2); // 15 max
  const anomaly = reviewAnomalyPenalty(p.reviews);
  let total = idScore+compScore+starScore+tenureScore-anomaly.penalty;
  total = Math.max(0, Math.min(100, total));
  return {total, idScore, compScore, starScore, tenureScore, anomaly};
}

function daysAgo(n){ return n===0?'today': n===1?'1 day ago': n+' days ago'; }

function bindGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{

      e.preventDefault();

      if(el.hasAttribute('data-authtab')) p.tab = el.getAttribute('data-authtab');
      go(v, p);

    const matchesCat = !cat || p.category===cat;
    return matchesQ && matchesCat;

  const sortBy = STATE.params.sort || 'trust';
  list = list.map(p=>({p, t:computeTrust(p)}));
  if(sortBy==='trust') list.sort((a,b)=>b.t.total-a.t.total);

        <div class="summary-row"><span class="k">Estimated price</span><span class="v">₹${p.priceFrom}–₹${p.priceTo}</span></div>
        <div class="summary-row"><span class="k">Preferred date</span><span class="v">${draft.date||'—'}</span></div>
        <div class="summary-row"><span class="k">Preferred time</span><span class="v">${draft.time||'—'}</span></div>
        <div class="summary-row"><span class="k">Trust score</span><span class="v">◈ ${computeTrust(p).total}/100</span></div>
      </div>
    </div>
  </div>`;
}
function bookingStepForm(p, step, draft){
  if(step===1){
    return `
    <h3 class="serif">Service details</h3>
    <div class="field"><label>Service type</label>
      <select id="bkService">${p.services.map(s=>`<option ${s===draft.service?'selected':''}>${esc(s)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Describe the issue</label>
      <textarea id="bkNotes" placeholder="e.g. laptop won't power on, screen flickers when opened...">${esc(draft.notes)}</textarea>
    </div>
    <button class="btn-primary btn-block" data-bkstep="2">Next: Schedule</button>`;
  }
  if(step===2){
    return `
    <h3 class="serif">Schedule</h3>
    <div class="field"><label>Preferred date</label><input type="date" id="bkDate" value="${draft.date}"/></div>
    <div class="field"><label>Preferred time</label>
      <select id="bkTime">
        ${['09:00','11:00','14:00','16:00','18:00'].map(t=>`<option ${t===draft.time?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <button class="btn-primary btn-block" data-bkstep="3">Next: Confirm</button>`;
  }
  if(step===3){
    return `
    <h3 class="serif">Confirm your request</h3>
    <p style="font-size:14px;color:var(--slate);line-height:1.6">
      You're requesting <b>${esc(draft.service)}</b> from <b>${esc(p.name)}</b>${draft.date?` on <b>${esc(draft.date)}</b> at <b>${esc(draft.time)}</b>`:''}.
      The provider will confirm availability before payment is due.
    </p>
    <button class="btn-primary btn-block" data-bkstep="4">Next: Payment</button>`;
  }
  if(step===4){
    return `
    <h3 class="serif">Payment</h3>
    <p style="font-size:14px;color:var(--slate);margin-bottom:16px">This prototype does not process real payments. Confirming will save your booking to your dashboard.</p>
    <div class="field"><label>Payment method</label>
      <select><option>Pay after service (cash/UPI)</option><option>Card on file</option></select>
    </div>
    <button class="btn-primary btn-block" data-bkconfirm="1">Confirm booking</button>`;
  }
  return '';
}

/* ---------- AUTH ---------- */

  const tab = STATE.params.tab || 'login';
  const err = STATE.params.error;
  return `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-tabs">
        <a href="#" data-authswitch="login" class="auth-tab ${tab==='login'?'active':''}">Log in</a>
        <a href="#" data-authswitch="signup" class="auth-tab ${tab==='signup'?'active':''}">Sign up</a>
      </div>
      ${tab==='login' ? `
        <h2 class="serif">Welcome back</h2>
        <div class="sub">Log in to manage bookings and messages.</div>
        ${err?`<div class="msg-err">${esc(err)}</div>`:''}
        <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="you@example.com"/></div>
        <div class="field"><label>Password</label><input type="password" id="authPassword" placeholder="Enter your password"/></div>
        <button class="btn-primary btn-block" data-action="login">Log in</button>
      ` : `
        <h2 class="serif">Create your account</h2>
        <div class="sub">Join TrustHub as a customer or a service provider.</div>
        ${err?`<div class="msg-err">${esc(err)}</div>`:''}
        <div class="role-pick">
          <div class="role-opt ${(STATE.params.role||'customer')==='customer'?'active':''}" data-roleopt="customer">I need services</div>
          <div class="role-opt ${STATE.params.role==='provider'?'active':''}" data-roleopt="provider">I offer services</div>
        </div>
        <div class="field"><label>Full name</label><input type="text" id="authName" placeholder="Your name"/></div>
        <div class="field"><label>Email</label><input type="email" id="authEmail2" placeholder="you@example.com"/></div>
        <div class="field"><label>Password</label><input type="password" id="authPassword2" placeholder="Create a password"/></div>
        <button class="btn-primary btn-block" data-action="signup">Create account</button>

/* ---------- CUSTOMER DASHBOARD ---------- */
function requireAuth(role){
  if(!STATE.user) return authView.__redirect = true;
}
function dashCustomerView(){
  if(!STATE.user) return authGate();
  const myBookings = STATE.bookings.filter(b=>b.userEmail===STATE.user.email);
  const saved = STATE.savedProviders.map(id=>providerById(id)).filter(Boolean);
  const completed = myBookings.filter(b=>b.status==='Completed').length;

  return dashShell('customer', `
    <div class="dash-head"><h2 class="serif">Welcome back, ${esc(STATE.user.name.split(' ')[0])}</h2><div class="sub">Here's what's happening with your bookings.</div></div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kv">${myBookings.filter(b=>b.status!=='Completed').length}</div><div class="kl">Active bookings</div></div>
      <div class="kpi-card"><div class="kv">${completed}</div><div class="kl">Completed services</div></div>
      <div class="kpi-card"><div class="kv">${saved.length}</div><div class="kl">Saved providers</div></div>
      <div class="kpi-card"><div class="kv">${saved.length? (saved.reduce((s,p)=>s+avgStars(p),0)/saved.length).toFixed(1):'—'}</div><div class="kl">Avg. saved rating</div></div>
    </div>
    <div class="panel">
      <h3 class="serif">Recent bookings</h3>
      ${myBookings.length? myBookings.slice().reverse().map(b=>`
        <div class="list-row">
          <div class="lr-main"><b>${esc(b.service)}</b><span>${esc(b.providerName)} · ${esc(b.date||'date pending')}</span></div>
          <span class="status-pill status-${b.status.toLowerCase().replace(' ','')}">${esc(b.status)}</span>
        </div>`).join('') : `<div class="empty-state">No bookings yet. <a href="#" data-nav="search" class="small-link">Browse services</a> to get started.</div>`}
    </div>
    <div class="panel">
      <h3 class="serif">Saved providers</h3>
      ${saved.length? saved.map(p=>`
        <div class="list-row">
          <div class="lr-main"><b class="catlink" data-provider="${p.id}" style="cursor:pointer">${esc(p.name)}</b><span>${p.services[0]} · ◈ ${computeTrust(p).total}/100</span></div>
          <button class="btn-outline" data-provider="${p.id}">View</button>
        </div>`).join('') : `<div class="empty-state">Save providers you like to find them quickly next time.</div>`}
    </div>
  `);
}

function authGate(){
  return `<div class="empty-state" style="padding:80px 20px">
    Log in to see your dashboard.<br/><br/>
    <button class="btn-primary" data-nav="auth" data-authtab="login">Log in</button>
  </div>`;
}

/* ---------- PROVIDER DASHBOARD ---------- */
function dashProviderView(){
  if(!STATE.user) return authGate();
  // Demo provider profile tied to the logged-in provider account
  const demoProvider = PROVIDERS[0];
  const t = computeTrust(demoProvider);
  const relevantBookings = STATE.bookings.filter(b=>b.providerId===demoProvider.id);

  return dashShell('provider', `
    <div class="dash-head"><h2 class="serif">Welcome, ${esc(STATE.user.name.split(' ')[0])}</h2><div class="sub">Managing ${esc(demoProvider.name)}</div></div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kv">${demoProvider.jobsCompleted}</div><div class="kl">Services completed</div></div>
      <div class="kpi-card"><div class="kv">${relevantBookings.filter(b=>b.status!=='Completed').length}</div><div class="kl">Active bookings</div></div>
      <div class="kpi-card"><div class="kv">${avgStars(demoProvider).toFixed(1)}</div><div class="kl">Average rating</div></div>
      <div class="kpi-card"><div class="kv">${t.total}</div><div class="kl">Trust score</div></div>
    </div>
    <div class="panel">
      <h3 class="serif">Incoming bookings</h3>
      ${relevantBookings.length? relevantBookings.slice().reverse().map(b=>`
        <div class="list-row">
          <div class="lr-main"><b>${esc(b.service)}</b><span>${esc(b.userName)} · ${esc(b.date||'date pending')}</span></div>
          <span class="status-pill status-${b.status.toLowerCase().replace(' ','')}">${esc(b.status)}</span>
        </div>`).join('') : `<div class="empty-state">No booking requests yet.</div>`}
    </div>
    <div class="panel">
      <h3 class="serif">Trust score breakdown</h3>
      ${trustRow('Identity & contact', t.idScore, 30)}
      ${trustRow('Completion rate', t.compScore, 30)}
      ${trustRow('Review quality', t.starScore, 25)}
      ${trustRow('Platform tenure', t.tenureScore, 15)}
    </div>
  `);
}

/* ---------- ADMIN DASHBOARD ---------- */
function dashAdminView(){
  if(!STATE.user) return authGate();
  const flagged = PROVIDERS.map(p=>({p, a:reviewAnomalyPenalty(p.reviews)})).filter(x=>x.a.flagged);
  const totalUsers = 1248, totalBookings = STATE.bookings.length + 176;

  return dashShell('admin', `
    <div class="dash-head"><h2 class="serif">System overview</h2><div class="sub">Platform-wide activity and integrity signals.</div></div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kv">${totalUsers}</div><div class="kl">Total users</div></div>
      <div class="kpi-card"><div class="kv">${PROVIDERS.filter(p=>p.identityVerified).length}/${PROVIDERS.length}</div><div class="kl">Verified providers</div></div>
      <div class="kpi-card"><div class="kv">${totalBookings}</div><div class="kl">Total bookings</div></div>
      <div class="kpi-card"><div class="kv">${flagged.length}</div><div class="kl">Flagged activities</div></div>
    </div>
    <div class="panel">
      <h3 class="serif">Flagged activity — rule-based review anomalies</h3>
      ${flagged.length? flagged.map(({p,a})=>`
        <div class="flag-row">
          <div class="lr-main"><b>${esc(p.name)}</b><span>${a.count} near-identical reviews posted within a short window</span></div>
          <span class="flag-sev sev-high">High</span>
        </div>`).join('') : `<div class="empty-state">No anomalies detected right now.</div>`}
    </div>
    <div class="panel">
      <h3 class="serif">Provider verification queue</h3>
      ${PROVIDERS.filter(p=>!p.identityVerified).map(p=>`
        <div class="list-row">
          <div class="lr-main"><b>${esc(p.name)}</b><span>Identity verification pending</span></div>
          <span class="status-pill status-pending">Pending</span>
        </div>`).join('') || `<div class="empty-state">All providers are verified.</div>`}
    </div>
  `);
}

function dashShell(role, content){
  const items = {
    customer: [['dashCustomer','Dashboard'],['search','Book a service']],
    provider: [['dashProvider','Dashboard'],['search','View marketplace']],
    admin: [['dashAdmin','Dashboard'],['search','View marketplace']],
  }[role];
  return `<div class="dash-layout">
    <nav class="side-nav">
      ${items.map(([v,l])=>`<a href="#" data-nav="${v}" class="${STATE.view===v?'active':''}">${l}</a>`).join('')}
    </nav>
    <div>${content}</div>
  </div>`;
}

/* ---------- ABOUT ---------- */
function aboutView(){
  return `
  <section style="padding:44px 0;max-width:70ch">
    <h2 class="serif" style="font-size:30px;color:var(--ink)">How TrustHub works</h2>
    <p style="color:var(--slate);line-height:1.7;font-size:15px;margin-bottom:20px">
      TrustHub combines identity verification, completed-job history, review quality, and a rule-based
      anomaly check into one transparent trust score, shown on every provider profile. Customers search,
      compare providers side by side, book directly, and leave reviews after the work is done. Providers
      manage their bookings and see exactly which factors make up their score.
    </p>
    <p style="color:var(--slate);line-height:1.7;font-size:15px">
      This build is a functioning front-end prototype: bookings, saved providers, and your account persist
      in your browser session, and the trust score is computed live from each provider's underlying data
      rather than hardcoded per profile.
    </p>
  </section>`;
}

/* ============================================================
   EVENT BINDING per-view
   ============================================================ */
function bindViewEvents(){
  // category links (home + search)
  document.querySelectorAll('.catlink[data-cat]').forEach(el=>{
    el.addEventListener('click', e=>{ e.preventDefault(); STATE.searchQuery=''; go('search', {cat: el.getAttribute('data-cat')}); });
  });
  // provider open
  document.querySelectorAll('[data-provider]').forEach(el=>{
    el.addEventListener('click', e=>{ e.preventDefault(); go('provider', {id: el.getAttribute('data-provider')}); });
  });
  // home search form
  const hf = document.getElementById('homeSearchForm');
  if(hf) hf.addEventListener('submit', e=>{
    e.preventDefault();
    STATE.searchQuery = document.getElementById('homeSearchInput').value;
    go('search', {});
  });
  // search filters
  document.querySelectorAll('[data-filtercat]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const checked = el.checked;
      go('search', {...STATE.params, cat: checked? el.getAttribute('data-filtercat'): undefined, sort: STATE.params.sort});
    });
  });
  const sortSel = document.getElementById('sortSelect');
  if(sortSel) sortSel.addEventListener('change', ()=> go('search', {...STATE.params, sort: sortSel.value}));
  const trustSlider = document.getElementById('trustSlider');
  if(trustSlider){
    const label = document.getElementById('trustSliderVal');
    trustSlider.addEventListener('input', ()=>{ label.textContent = trustSlider.value==='0'? 'Any' : trustSlider.value+'+'; });
  }
  // provider profile tabs
  document.querySelectorAll('[data-ptab]').forEach(el=>{
    el.addEventListener('click', e=>{ e.preventDefault(); go('provider', {...STATE.params, tab: el.getAttribute('data-ptab')}); });
  });
  // save provider
  document.querySelectorAll('[data-save]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!STATE.user){ go('auth',{tab:'login', error:'Log in to save providers.'}); return; }
      const id = el.getAttribute('data-save');
      const idx = STATE.savedProviders.indexOf(id);
      if(idx>-1) STATE.savedProviders.splice(idx,1); else STATE.savedProviders.push(id);
      await saveSaved(STATE.savedProviders);
      render();
    });
  });
  // book buttons
  document.querySelectorAll('[data-book]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!STATE.user){ go('auth',{tab:'login', error:'Log in to book a service.'}); return; }
      go('book', {id: el.getAttribute('data-book'), step:1, draft:{service: providerById(el.getAttribute('data-book')).services[0], notes:'', date:'', time:'10:00'}});
    });
  });
  // booking step nav
  document.querySelectorAll('[data-bkstep]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const draft = {...STATE.params.draft};
      const step = Number(STATE.params.step);
      if(step===1){ draft.service = document.getElementById('bkService').value; draft.notes = document.getElementById('bkNotes').value; }
      if(step===2){ draft.date = document.getElementById('bkDate').value; draft.time = document.getElementById('bkTime').value; }
      go('book', {...STATE.params, step: Number(el.getAttribute('data-bkstep')), draft});
    });
  });
  const confirmBtn = document.querySelector('[data-bkconfirm]');
  if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
    const p = providerById(STATE.params.id);
    const draft = STATE.params.draft;
    const booking = {
      id: 'bk'+Date.now(), providerId: p.id, providerName: p.name,
      userEmail: STATE.user.email, userName: STATE.user.name,
      service: draft.service, notes: draft.notes, date: draft.date, time: draft.time,
      status: 'Pending', createdAt: Date.now(),
    };
    STATE.bookings.push(booking);
    await saveBookings(STATE.bookings);
    go('book', {...STATE.params, step:5});
  });
  // auth tab switch
  document.querySelectorAll('[data-authswitch]').forEach(el=>{
    el.addEventListener('click', e=>{ e.preventDefault(); go('auth', {tab: el.getAttribute('data-authswitch')}); });
  });
  document.querySelectorAll('[data-roleopt]').forEach(el=>{
    el.addEventListener('click', ()=>{ go('auth', {...STATE.params, role: el.getAttribute('data-roleopt')}); });
  });
  // login/signup actions
  const loginBtn = document.querySelector('[data-action="login"]');
  if(loginBtn) loginBtn.addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const pw = document.getElementById('authPassword').value;
    if(!email || !pw){ go('auth',{tab:'login', error:'Enter your email and password.'}); return; }
    // Demo auth: assign role admin@ / provider@ prefixes, else customer
    let role = 'customer';
    if(email.startsWith('admin')) role='admin';
    else if(email.startsWith('provider')) role='provider';
    const user = {name: email.split('@')[0].replace(/[._]/g,' '), email, role};
    STATE.user = user; await saveUser(user);
    go(role==='admin'?'dashAdmin': role==='provider'?'dashProvider':'dashCustomer');
  });
  const signupBtn = document.querySelector('[data-action="signup"]');
  if(signupBtn) signupBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('authName').value.trim();
    const email = document.getElementById('authEmail2').value.trim();
    const pw = document.getElementById('authPassword2').value;
    if(!name || !email || !pw){ go('auth',{tab:'signup', role: STATE.params.role, error:'Fill in all fields to continue.'}); return; }
    const role = STATE.params.role || 'customer';
    const user = {name, email, role};
    STATE.user = user; await saveUser(user);
    go(role==='admin'?'dashAdmin': role==='provider'?'dashProvider':'dashCustomer');
  });
}

initState();
</script>
