services:
  - type: web
    name: trusthub-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: ENABLE_GUEST_LOGIN
        value: true
      - key: GUEST_EMAIL
        value: guest@trusthub.demo